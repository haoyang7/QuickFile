name: QuickFile

options:
  bundleIdPrefix: com.haoyoung
  createIntermediateGroups: true
  generateEmptyDirectories: true
  groupSortPosition: top
  developmentLanguage: zh-Hans
  knownRegions: [en, zh-Hans]

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_EMIT_LOC_STRINGS: YES
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    ARCHS: "arm64 x86_64"
    ONLY_ACTIVE_ARCH: "NO"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "113"
    QUICKFILE_STORAGE_MODE: "local-shared"
    QUICKFILE_DISTRIBUTION_CHANNEL: "development"

packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.0

targets:
  QuickFileCore:
    type: library.static
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - path: Shared/QuickFileLocalization.swift
      - path: Shared/FileTemplate.swift
      - path: Shared/OfficeDocumentFormat.swift
      - path: Shared/OfficeDocumentData.swift
      - path: Shared/TemplateDraft.swift
      - path: Shared/TemplateByteOperations.swift
      - path: Shared/TemplateTransfer.swift
      - path: Shared/QuickFileAppRoute.swift
      - path: Shared/TemplateRenderer.swift
      - path: Shared/TemplatePreview.swift
      - path: Shared/FilenameNormalizer.swift
      - path: Shared/FileCreationModels.swift
      - path: Shared/CreationTiming.swift
      - path: Shared/FileCreationService.swift
      - path: Shared/PrivateFileStagingDirectory.swift
      - path: Shared/DirectoryPathPolicy.swift
      - path: Shared/FinderContextResolver.swift
      - path: Shared/FinderMenuModel.swift
      - path: Shared/FinderMenuDisplayLimit.swift
      - path: Shared/FinderMenuDestinationCache.swift
      - path: Shared/FinderAuthorizationRequest.swift
      - path: Shared/FinderExtensionActivity.swift
    settings:
      base:
        PRODUCT_NAME: QuickFileCore
        APPLICATION_EXTENSION_API_ONLY: YES
        DEFINES_MODULE: YES
        SKIP_INSTALL: YES

  QuickFileInfrastructure:
    type: library.static
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - path: Shared/QuickFileSharedStorage.swift
      - path: Shared/AuthorizedDirectory.swift
      - path: Shared/AuthorizedDirectoryPolicy.swift
      - path: Shared/AuthorizedDirectoryRepository.swift
      - path: Shared/AuthorizedDirectoryStore.swift
      - path: Shared/AuthorizedDirectoryFailureClassifier.swift
      - path: Shared/SecurityScopedBookmarkClient.swift
      - path: Shared/DirectoryDiagnostics.swift
      - path: Shared/FinderAuthorizationRequestStore.swift
      - path: Shared/FinderExtensionActivityStore.swift
      - path: Shared/FinderExtensionProbe.swift
      - path: Shared/FinderFirstUseVerification.swift
      - path: Shared/TemplateStore.swift
      - path: Shared/TemplateTransferFile.swift
      - path: Shared/FinderMenuSettingsStore.swift
      - path: Shared/FileCreationSettingsStore.swift
      - path: Shared/LanguageSettingsStore.swift
      - path: Shared/TemplateStoreFailureClassifier.swift
    settings:
      base:
        PRODUCT_NAME: QuickFileInfrastructure
        APPLICATION_EXTENSION_API_ONLY: YES
        DEFINES_MODULE: YES
        SKIP_INSTALL: YES
    dependencies:
      - target: QuickFileCore

  QuickFileApplication:
    type: library.static
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - path: Shared/FinderAuthorizationCoordinator.swift
      - path: Shared/FinderExtensionFailureClassifier.swift
      - path: Shared/FinderFileCreationCoordinator.swift
    settings:
      base:
        PRODUCT_NAME: QuickFileApplication
        APPLICATION_EXTENSION_API_ONLY: YES
        DEFINES_MODULE: YES
        SKIP_INSTALL: YES
    dependencies:
      - target: QuickFileCore

  QuickFile:
    type: application
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - path: QuickFileApp
        excludes:
          - "AXCompatibility.m"
          - "**/*.entitlements"
          - "**/Info.plist"
      - path: QuickFileApp/AXCompatibility.m
        compilerFlags: "-fno-objc-arc"
      - path: Resources/Localizable.xcstrings
    settings:
      base:
        SWIFT_OBJC_BRIDGING_HEADER: QuickFileApp/QuickFile-Bridging-Header.h
        PRODUCT_BUNDLE_IDENTIFIER: com.haoyoung.QuickFile
        PRODUCT_NAME: QuickFile
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: QuickFileApp/QuickFile.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        QUICKFILE_UPDATES_ENABLED: "NO"
        QUICKFILE_UPDATE_FEED_URL: ""
        QUICKFILE_UPDATE_PUBLIC_KEY: ""
    info:
      path: QuickFileApp/Info.plist
      properties:
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        QuickFileStorageMode: "$(QUICKFILE_STORAGE_MODE)"
        QuickFileDistributionChannel: "$(QUICKFILE_DISTRIBUTION_CHANNEL)"
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.haoyoung.QuickFile.template-order
            UTTypeDescription: QuickFile Template Order
            UTTypeConformsTo: [public.data]
        CFBundleURLTypes:
          - CFBundleURLName: com.haoyoung.QuickFile.navigation
            CFBundleTypeRole: Editor
            CFBundleURLSchemes: [quickfile]
        NSServices:
          - NSMenuItem:
              default: New File with QuickFile…
            NSMessage: newFileWithQuickFile
            NSPortName: QuickFile
            NSSendFileTypes: [public.folder]
            NSRequiredContext: {}
            NSRestricted: false
        QuickFileUpdatesEnabled: "$(QUICKFILE_UPDATES_ENABLED)"
        SUFeedURL: "$(QUICKFILE_UPDATE_FEED_URL)"
        SUPublicEDKey: "$(QUICKFILE_UPDATE_PUBLIC_KEY)"
        SUEnableInstallerLauncherService: true
        SUEnableDownloaderService: true
        SUEnableAutomaticChecks: false
        SUAllowsAutomaticUpdates: false
        SUEnableSystemProfiling: false
        SUSendProfileInfo: false
        SUEnableJavaScript: false
        SUScheduledCheckInterval: 86400
    entitlements:
      path: QuickFileApp/QuickFile.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.files.bookmarks.app-scope: true
        com.apple.security.network.client: true
        com.apple.security.temporary-exception.mach-lookup.global-name:
          - $(PRODUCT_BUNDLE_IDENTIFIER)-spks
          - $(PRODUCT_BUNDLE_IDENTIFIER)-spki
        com.apple.security.temporary-exception.files.home-relative-path.read-write:
          - "/Library/Application Support/QuickFileCommunity/"
    dependencies:
      - package: Sparkle
      - target: FinderExtension
      - target: QuickFileCore
      - target: QuickFileInfrastructure
      - target: QuickFileApplication
    postBuildScripts:
      - name: Sign Sparkle helpers
        path: Scripts/sign-sparkle.sh
        basedOnDependencyAnalysis: false
        inputFiles:
          - "$(TARGET_BUILD_DIR)/$(FRAMEWORKS_FOLDER_PATH)/Sparkle.framework/Versions/B/Sparkle"
  FinderExtension:
    type: app-extension
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - path: QuickFileApp/AutomaticFileOpener.swift
      - path: FinderExtension
        excludes:
          - "**/*.entitlements"
          - "**/Info.plist"
      - path: Resources/Localizable.xcstrings
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.haoyoung.QuickFile.FinderExtension
        PRODUCT_NAME: FinderExtension
        APPLICATION_EXTENSION_API_ONLY: YES
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: FinderExtension/FinderExtension.entitlements
        ENABLE_HARDENED_RUNTIME: YES
    info:
      path: FinderExtension/Info.plist
      properties:
        CFBundleDisplayName: QuickFile Finder Extension
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        QuickFileStorageMode: "$(QUICKFILE_STORAGE_MODE)"
        QuickFileDistributionChannel: "$(QUICKFILE_DISTRIBUTION_CHANNEL)"
        LSUIElement: true
        NSExtension:
          NSExtensionPointIdentifier: com.apple.FinderSync
          NSExtensionPrincipalClass: "$(PRODUCT_MODULE_NAME).FinderSync"
    entitlements:
      path: FinderExtension/FinderExtension.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.bookmarks.app-scope: true
        com.apple.security.temporary-exception.files.home-relative-path.read-write:
          - "/Library/Application Support/QuickFileCommunity/"
    dependencies:
      - target: QuickFileCore
      - target: QuickFileInfrastructure
      - target: QuickFileApplication

  QuickFileStorageWriterFixture:
    type: tool
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - path: Scripts/tests/fixtures/LocalSharedStorageWriter.c
    settings:
      base:
        PRODUCT_NAME: QuickFileStorageWriterFixture
        SKIP_INSTALL: YES

  QuickFileTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - path: QuickFileTests
      - path: FinderExtension/FinderSync.swift
      - path: FinderExtension/FinderTemplateCache.swift
      - path: FinderExtension/FinderMenuSettingsCache.swift
      - path: FinderExtension/FinderLanguageSettings.swift
      - path: FinderExtension/FinderActivityRecorder.swift
      - path: FinderExtension/FinderOperationScheduler.swift
      - path: FinderExtension/FinderDirectoryMonitor.swift
      - path: FinderExtension/FinderMenuPresentation.swift
      - path: FinderExtension/ContainingApplicationLauncher.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.haoyoung.QuickFileTests
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) QUICKFILE_FINDER_TESTS"
        PRODUCT_NAME: QuickFileTests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/QuickFile.app/Contents/MacOS/QuickFile"
        BUNDLE_LOADER: "$(TEST_HOST)"
    dependencies:
      - target: QuickFile
      - target: QuickFileStorageWriterFixture
        link: false
        embed: true
        copy:
          destination: executables

schemes:
  QuickFile:
    build:
      targets:
        QuickFile: all
    test:
      targets: [QuickFileTests]
      language: zh-Hans
      region: CN

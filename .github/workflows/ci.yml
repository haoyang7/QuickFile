name: CI

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'project.yml'
      - 'QuickFile.xcodeproj/**'
      - 'QuickFileApp/**'
      - 'FinderExtension/**'
      - 'Shared/**'
      - 'QuickFileTests/**'
      - 'Scripts/**'
      - 'Release/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  changes:
    name: Classify verification scope
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      run_checks: ${{ steps.scope.outputs.run_checks }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Classify changed paths
        id: scope
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          python3 - <<'PY'
          import os
          import re
          import subprocess
          from pathlib import Path

          run_checks = True
          if os.environ["GITHUB_EVENT_NAME"] == "pull_request":
              head = os.environ["PR_HEAD_SHA"]
              base = os.environ["PR_BASE_SHA"]
              if not all(re.fullmatch(r"[0-9a-f]{40}", sha) for sha in (base, head)):
                  raise ValueError("PR base/head must be full commit SHAs")
              # Three-dot PR scope; no rename detection so old code paths also count.
              changed = subprocess.check_output([
                  "git", "diff", "--name-only", "--no-renames", "-z", f"{base}...{head}", "--",
              ]).split(b"\0")
              paths = [path for path in changed if path]
              run_checks = any(
                  not (path == b"LICENSE" or (b"/" not in path and path.endswith(b".md")))
                  for path in paths
              )
          with Path(os.environ["GITHUB_OUTPUT"]).open("a") as output:
              output.write(f"run_checks={str(run_checks).lower()}\n")
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a") as summary:
              summary.write("### Verification scope\n\n")
              summary.write("Full Linux and macOS validation required.\n" if run_checks else
                            "Only root Markdown/LICENSE changes; Linux and macOS tests are skipped, not tested.\n")
          PY

  scripts:
    name: Python scripts (Linux)
    needs: changes
    if: needs.changes.outputs.run_checks == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Run script tests
        run: python3 -m unittest discover -s Scripts/tests -v
      - name: Record verification scope
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          checkout_sha="$(git rev-parse --verify HEAD 2>/dev/null || printf '%s' unavailable)"
          {
            printf '### Script verification\n\n'
            printf -- '- Tested checkout SHA: `%s`\n' "$checkout_sha"
            printf -- '- Event SHA (GITHUB_SHA): `%s`\n' "$GITHUB_SHA"
            if [[ -n "$PR_HEAD_SHA" ]]; then
              printf -- '- PR head SHA: `%s`\n' "$PR_HEAD_SHA"
              printf -- '- PR base SHA: `%s`\n' "$PR_BASE_SHA"
            fi
            printf -- '- Run: %s/%s/actions/runs/%s\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID"
            printf -- '- Job result: `%s`\n' "$JOB_STATUS"
            printf '\n%s\n' 'Scope: Python fixtures and file/process transaction tests on Linux; signing tools are mocked.'
          } >> "$GITHUB_STEP_SUMMARY"

  macos:
    name: macOS ${{ matrix.macos_major }} (${{ matrix.architecture }}, Xcode ${{ matrix.xcode_version }})
    needs: [changes, scripts]
    if: needs.changes.outputs.run_checks == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            macos_major: '15'
            architecture: arm64
            xcode_version: '26.3'
            developer_directory: /Applications/Xcode_26.3.app/Contents/Developer
          - runner: macos-15-intel
            macos_major: '15'
            architecture: x86_64
            xcode_version: '26.3'
            developer_directory: /Applications/Xcode_26.3.app/Contents/Developer
          - runner: macos-26
            macos_major: '26'
            architecture: arm64
            xcode_version: '26.3'
            developer_directory: /Applications/Xcode_26.3.app/Contents/Developer
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: ${{ matrix.developer_directory }}
      EXPECTED_RUNNER: ${{ matrix.runner }}
      EXPECTED_MACOS_MAJOR: ${{ matrix.macos_major }}
      EXPECTED_ARCHITECTURE: ${{ matrix.architecture }}
      EXPECTED_XCODE_VERSION: ${{ matrix.xcode_version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Verify host OS, architecture and selected Xcode
        id: identity
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: python3 Scripts/ci-evidence.py initialize
      - name: Install XcodeGen 2.46.0
        id: tools
        run: |
          mkdir -p "$RUNNER_TEMP/quickfile-tools"
          archive="$RUNNER_TEMP/quickfile-tools/xcodegen.zip"
          curl --fail --silent --show-error --location \
            https://github.com/yonaskolb/XcodeGen/releases/download/2.46.0/xcodegen.zip \
            --output "$archive"
          printf '%s  %s\n' \
            4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806 \
            "$archive" | shasum --algorithm 256 --check
          unzip -q "$archive" -d "$RUNNER_TEMP/quickfile-tools"
          test "$("$RUNNER_TEMP/quickfile-tools/xcodegen/bin/xcodegen" version)" = 'Version: 2.46.0'
          echo "$RUNNER_TEMP/quickfile-tools/xcodegen/bin" >> "$GITHUB_PATH"
      - name: Run script tests
        id: scripts
        env:
          CI_EVIDENCE_ROOT: ${{ steps.identity.outputs.root }}
        run: python3 Scripts/ci-evidence.py run-scripts "$CI_EVIDENCE_ROOT" -- python3 -m unittest discover -s Scripts/tests -v
      - name: Run native tests and unsigned Universal self-check
        id: native
        env:
          CI_EVIDENCE_ROOT: ${{ steps.identity.outputs.root }}
        run: python3 Scripts/ci-evidence.py run-native "$CI_EVIDENCE_ROOT" -- ./Scripts/verify-release-readiness.sh
      - name: Prepare allowlisted verification receipts
        id: evidence
        if: always() && steps.identity.outputs.root != ''
        env:
          CI_EVIDENCE_ROOT: ${{ steps.identity.outputs.root }}
          IDENTITY_OUTCOME: ${{ steps.identity.outcome }}
          TOOLS_OUTCOME: ${{ steps.tools.outcome }}
          SCRIPTS_OUTCOME: ${{ steps.scripts.outcome }}
          NATIVE_OUTCOME: ${{ steps.native.outcome }}
          JOB_STATUS: ${{ job.status }}
        run: python3 Scripts/ci-evidence.py finish "$CI_EVIDENCE_ROOT"
      - name: Retain sanitized CI receipts for 7 days
        if: always() && steps.evidence.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.identity.outputs.artifact_name }}
          # Exact files only; no glob, raw xcresult, logs or build products.
          path: |
            ${{ steps.identity.outputs.root }}/upload/identity.json
            ${{ steps.identity.outputs.root }}/upload/verification.json
            ${{ steps.identity.outputs.root }}/upload/ax-evidence.json
            ${{ steps.identity.outputs.root }}/upload/ax-lifecycle.json
          retention-days: 7
          if-no-files-found: error
          include-hidden-files: false
          overwrite: false

  required:
    name: CI required
    needs: [changes, scripts, macos]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require successful verification or explicit documentation skip
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          RUN_CHECKS: ${{ needs.changes.outputs.run_checks }}
          SCRIPTS_RESULT: ${{ needs.scripts.result }}
          MACOS_RESULT: ${{ needs.macos.result }}
        run: |
          if [[ "$CHANGES_RESULT" == success && "$RUN_CHECKS" == false &&
                "$SCRIPTS_RESULT" == skipped && "$MACOS_RESULT" == skipped ]]; then
            printf '%s\n' 'Documentation scope accepted; Linux and macOS tests were skipped, not tested.' >> "$GITHUB_STEP_SUMMARY"
          elif [[ "$CHANGES_RESULT" == success && "$RUN_CHECKS" == true &&
                  "$SCRIPTS_RESULT" == success && "$MACOS_RESULT" == success ]]; then
            printf '%s\n' 'Linux script tests and all three macOS validation lanes succeeded.' >> "$GITHUB_STEP_SUMMARY"
          else
            printf '%s\n' 'CI required failed: verification scope or required jobs did not complete successfully.' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
